<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML 猫咪</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%B1%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --fur: #f4a261;
    --fur-dark: #e07b39;
    --stripe: #c9682a;
    --cream: #fff4e6;
    --line: #3b2416;
    --bg-top: #cfe8ff;
    --bg-bottom: #f6fbff;
    --sun: #ffe08a;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    display: grid;
    place-items: center;
    min-height: 100vh;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: #2b3a4a;
    background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
  }

  .card {
    width: min(92vw, 560px);
    padding: 28px 28px 20px;
    border-radius: 24px;
    background: #fffdf9;
    box-shadow: 0 18px 40px rgba(43, 58, 74, .14);
    text-align: center;
  }

  h1 {
    margin: 0 0 4px;
    font-size: 22px;
    letter-spacing: .06em;
  }

  .hint {
    margin: 0 0 10px;
    font-size: 13px;
    color: #7b8a99;
  }

  .stage {
    position: relative;
    display: grid;
    place-items: end center;
    min-height: 340px;
    border-radius: 16px;
    overflow: hidden;
    background:
      radial-gradient(circle at 84% 16%, var(--sun) 0 34px, rgba(255, 224, 138, .28) 35px 46px, transparent 47px),
      linear-gradient(180deg, #eaf6ff, #ffffff 70%);
  }

  .ground {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 64px;
    background: linear-gradient(180deg, #bfe3b4, #9ed190);
    border-top: 3px solid #8ac47c;
  }

  .cat {
    position: relative;
    width: 300px;
    height: 300px;
    transform-origin: 50% 100%;
    animation: breathe 4.2s ease-in-out infinite;
  }

  .cat svg { display: block; width: 100%; height: 100%; overflow: visible; }

  /* 整体呼吸动画 */
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.015); }
  }

  /* 尾巴摆动 */
  .tail {
    transform-origin: 58px 168px;
    animation: wag 2.6s ease-in-out infinite;
  }
  @keyframes wag {
    0%, 100% { transform: rotate(-8deg); }
    50%      { transform: rotate(10deg); }
  }

  /* 眨眼 */
  .eye-lid {
    transform-box: fill-box;
    transform-origin: center;
    transform: scaleY(0);
    animation: blink 5s infinite;
  }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(0); }
    95%           { transform: scaleY(1); }
  }

  /* 瞳孔跟随鼠标 */
  .pupil { transition: transform .12s ease-out; }

  /* 胡须抖动 */
  .whisker {
    transform-box: fill-box;
    transform-origin: center;
    animation: twitch 3.4s ease-in-out infinite;
  }
  .whisker.right { animation-delay: .5s; }
  @keyframes twitch {
    0%, 88%, 100% { transform: rotate(0deg); }
    92%           { transform: rotate(3deg); }
    96%           { transform: rotate(-2deg); }
  }

  /* 点击后的情绪状态 */
  .cat.happy .eye-open { opacity: 0; }
  .cat.happy .eye-happy { opacity: 1; }
  .eye-happy { opacity: 0; transition: opacity .2s; }

  .cat.happy .heart { opacity: 1; transform: translateY(-18px) scale(1); }
  .heart {
    opacity: 0;
    transition: opacity .3s, transform .6s ease-out;
    transform: translateY(6px) scale(.4);
  }

  .controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 14px;
    flex-wrap: wrap;
  }

  button {
    padding: 9px 18px;
    border: 0;
    border-radius: 999px;
    font: inherit;
    font-size: 14px;
    color: #fff;
    background: var(--fur-dark);
    cursor: pointer;
    transition: transform .15s, filter .15s;
  }
  button:hover { filter: brightness(1.06); transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  button.secondary { color: var(--line); background: #f1e3d3; }

  @media (prefers-reduced-motion: reduce) {
    .cat, .tail, .eye-lid, .whisker { animation: none; }
  }
</style>
</head>
<body>
  <main class="card">
    <h1>一只 Web 猫咪</h1>
    <p class="hint">用纯 HTML + 内联 SVG 绘制，移动鼠标看看小猫的眼神，点击它试试。</p>

    <div class="stage" id="stage">
      <div class="ground" aria-hidden="true"></div>
      <div class="cat" id="cat" role="img" aria-label="一只橙色的虎斑猫坐在地上">
        <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="furGrad" x1="0" y1="0" x2="0" y2="1">
              <!-- 由脚本根据毛色调色板写入 -->
              <stop offset="0" class="fur-top" stop-color="#f8b57d"/>
              <stop offset="1" class="fur-bottom" stop-color="#e8873f"/>
            </linearGradient>
            <radialGradient id="chestGrad" cx="50%" cy="45%" r="60%">
              <stop offset="0" stop-color="#fffaf2"/>
              <stop offset="1" stop-color="#f9e6d0"/>
            </radialGradient>
          </defs>

          <!-- 地面阴影 -->
          <ellipse cx="150" cy="286" rx="104" ry="13" fill="rgba(60,80,60,.16)"/>

          <!-- 尾巴 -->
          <g class="tail">
            <path d="M60 250 C 18 244, 8 196, 40 168 C 52 158, 62 160, 62 172 C 62 182, 52 184, 46 190 C 30 208, 40 226, 66 226 Z"
                  fill="url(#furGrad)" stroke="#c9682a" stroke-width="3" stroke-linejoin="round"/>
            <path d="M44 250 C 40 240, 44 232, 52 228" fill="none" stroke="#c9682a" stroke-width="5" stroke-linecap="round"/>
          </g>

          <!-- 身体 -->
          <path d="M150 118 C 196 118, 226 170, 228 236 C 229 262, 214 272, 190 272 L 110 272 C 86 272, 71 262, 72 236 C 74 170, 104 118, 150 118 Z"
                fill="url(#furGrad)" stroke="#c9682a" stroke-width="3"/>
          <!-- 身体虎斑 -->
          <g stroke="#c9682a" stroke-width="7" stroke-linecap="round" fill="none" opacity=".75">
            <path d="M96 180 C 106 186, 112 192, 114 200"/>
            <path d="M90 206 C 102 210, 110 216, 113 224"/>
            <path d="M204 180 C 194 186, 188 192, 186 200"/>
            <path d="M210 206 C 198 210, 190 216, 187 224"/>
          </g>
          <!-- 胸口毛 -->
          <path d="M150 150 C 178 150, 190 196, 186 236 C 184 258, 168 266, 150 266 C 132 266, 116 258, 114 236 C 110 196, 122 150, 150 150 Z"
                fill="url(#chestGrad)"/>

          <!-- 前爪 -->
          <ellipse cx="122" cy="262" rx="22" ry="14" fill="#fff7ec" stroke="#e0b895" stroke-width="2.5"/>
          <ellipse cx="178" cy="262" rx="22" ry="14" fill="#fff7ec" stroke="#e0b895" stroke-width="2.5"/>
          <g stroke="#e0b895" stroke-width="2" stroke-linecap="round">
            <path d="M115 256 L115 266"/><path d="M122 255 L122 267"/><path d="M129 256 L129 266"/>
            <path d="M171 256 L171 266"/><path d="M178 255 L178 267"/><path d="M185 256 L185 266"/>
          </g>

          <!-- 头部：耳朵 -->
          <path d="M92 92 L86 34 L136 62 Z" fill="url(#furGrad)" stroke="#c9682a" stroke-width="3" stroke-linejoin="round"/>
          <path d="M208 92 L214 34 L164 62 Z" fill="url(#furGrad)" stroke="#c9682a" stroke-width="3" stroke-linejoin="round"/>
          <path d="M99 82 L96 50 L126 67 Z" fill="#f7c1b6"/>
          <path d="M201 82 L204 50 L174 67 Z" fill="#f7c1b6"/>

          <!-- 头 -->
          <ellipse cx="150" cy="108" rx="76" ry="64" fill="url(#furGrad)" stroke="#c9682a" stroke-width="3"/>

          <!-- 头部虎斑（额头 M 纹） -->
          <g stroke="#c9682a" stroke-width="6" stroke-linecap="round" fill="none" opacity=".8">
            <path d="M150 52 L150 74"/>
            <path d="M128 56 L134 74"/>
            <path d="M172 56 L166 74"/>
            <path d="M108 62 L116 78"/>
            <path d="M192 62 L184 78"/>
          </g>

          <!-- 眼睛 -->
          <g class="eyes">
            <g>
              <ellipse cx="122" cy="106" rx="18" ry="20" fill="#fffdf8" stroke="#b5531f" stroke-width="2.5"/>
              <ellipse class="pupil" data-cx="122" data-cy="106" cx="122" cy="106" rx="10" ry="15" fill="#4a8f3c"/>
              <ellipse class="pupil" data-cx="122" data-cy="106" cx="122" cy="106" rx="4.5" ry="13" fill="#231a12"/>
              <circle cx="126" cy="99" r="3.2" fill="#fff"/>
              <ellipse class="eye-lid eye-open" cx="122" cy="106" rx="18" ry="20" fill="url(#furGrad)"/>
              <path class="eye-happy" d="M108 110 C 114 98, 130 98, 136 110" fill="none" stroke="#3b2416" stroke-width="4" stroke-linecap="round"/>
            </g>
            <g>
              <ellipse cx="178" cy="106" rx="18" ry="20" fill="#fffdf8" stroke="#b5531f" stroke-width="2.5"/>
              <ellipse class="pupil" data-cx="178" data-cy="106" cx="178" cy="106" rx="10" ry="15" fill="#4a8f3c"/>
              <ellipse class="pupil" data-cx="178" data-cy="106" cx="178" cy="106" rx="4.5" ry="13" fill="#231a12"/>
              <circle cx="182" cy="99" r="3.2" fill="#fff"/>
              <ellipse class="eye-lid eye-open" cx="178" cy="106" rx="18" ry="20" fill="url(#furGrad)"/>
              <path class="eye-happy" d="M164 110 C 170 98, 186 98, 192 110" fill="none" stroke="#3b2416" stroke-width="4" stroke-linecap="round"/>
            </g>
          </g>

          <!-- 鼻子与嘴 -->
          <path d="M143 126 L157 126 L150 135 Z" fill="#e8828e" stroke="#c46a75" stroke-width="2" stroke-linejoin="round"/>
          <path d="M150 135 L150 142 M150 142 C 146 150, 138 150, 134 144 M150 142 C 154 150, 162 150, 166 144"
                fill="none" stroke="#3b2416" stroke-width="3" stroke-linecap="round"/>

          <!-- 腮红 -->
          <ellipse cx="100" cy="136" rx="13" ry="8" fill="#f6a5a5" opacity=".45"/>
          <ellipse cx="200" cy="136" rx="13" ry="8" fill="#f6a5a5" opacity=".45"/>

          <!-- 胡须 -->
          <g class="whisker left" stroke="#5b4433" stroke-width="2.4" stroke-linecap="round">
            <path d="M124 141 L64 130"/>
            <path d="M124 146 L62 148"/>
            <path d="M124 151 L68 166"/>
          </g>
          <g class="whisker right" stroke="#5b4433" stroke-width="2.4" stroke-linecap="round">
            <path d="M176 141 L236 130"/>
            <path d="M176 146 L238 148"/>
            <path d="M176 151 L232 166"/>
          </g>

          <!-- 爱心 -->
          <path class="heart" d="M150 44 C 144 34, 128 34, 128 46 C 128 56, 142 64, 150 70 C 158 64, 172 56, 172 46 C 172 34, 156 34, 150 44 Z"
                fill="#ff6b81"/>
        </svg>
      </div>
    </div>

    <div class="controls">
      <button type="button" id="happy">摸摸它</button>
      <button type="button" class="secondary" id="fur">换个毛色</button>
    </div>
  </main>

<script>
  const cat = document.getElementById('cat');
  const pupils = document.querySelectorAll('.pupil');

  // 瞳孔跟随鼠标
  function trackEyes(event) {
    const stage = document.getElementById('stage').getBoundingClientRect();
    const x = event.clientX - stage.left - stage.width / 2;
    const y = event.clientY - stage.top - stage.height * 0.42;
    const angle = Math.atan2(y, x);
    const dist = Math.min(Math.hypot(x, y) / 18, 5);
    pupils.forEach(p => {
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist;
      p.setAttribute('transform', `translate(${dx.toFixed(2)} ${dy.toFixed(2)})`);
    });
  }
  window.addEventListener('pointermove', trackEyes);
  window.addEventListener('pointerleave', () => pupils.forEach(p => p.removeAttribute('transform')));

  // 摸一摸：眯眼 + 冒爱心
  let happyTimer;
  function beHappy() {
    cat.classList.add('happy');
    clearTimeout(happyTimer);
    happyTimer = setTimeout(() => cat.classList.remove('happy'), 1400);
  }
  cat.addEventListener('click', beHappy);
  document.getElementById('happy').addEventListener('click', beHappy);

  // 换毛色
  const palettes = [
    { top: '#f8b57d', bottom: '#e8873f', stripe: '#c9682a', blush: 0.45, name: '橘色虎斑' },
    { top: '#d9d7d2', bottom: '#a8a5a0', stripe: '#79766f', blush: 0.35, name: '灰色狸花' },
    { top: '#ffffff', bottom: '#efe9e0', stripe: '#c4beb4', blush: 0.55, name: '白猫' },
    { top: '#6b6562', bottom: '#3a3735', stripe: '#242120', blush: 0.25, name: '黑猫' }
  ];
  const furTop = document.querySelector('.fur-top');
  const furBottom = document.querySelector('.fur-bottom');
  const stripes = document.querySelectorAll('[stroke="#c9682a"]');
  const blush = document.querySelectorAll('ellipse[fill="#f6a5a5"]');
  let paletteIndex = 0;

  document.getElementById('fur').addEventListener('click', () => {
    paletteIndex = (paletteIndex + 1) % palettes.length;
    const p = palettes[paletteIndex];
    furTop.setAttribute('stop-color', p.top);
    furBottom.setAttribute('stop-color', p.bottom);
    stripes.forEach(el => el.setAttribute('stroke', p.stripe));
    blush.forEach(el => el.setAttribute('opacity', p.blush));
    cat.setAttribute('aria-label', `一只${p.name}，坐在地上`);
  });
</script>
</body>
</html>
